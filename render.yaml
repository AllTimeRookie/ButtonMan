services:
  - type: web
    name: buttonman-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
